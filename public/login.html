<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Partners - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div class="container">
    <h1>Trading Partners</h1>

    <div class="tabs">
      <button id="tab-login" class="tab-button active">Login</button>
      <button id="tab-signup" class="tab-button">Sign Up</button>
    </div>

    <section class="card">
      <h2 id="form-title">Login</h2>

      <form id="auth-form">
        <div id="name-field">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <div id="forgot-container" style="margin-top: 0.5rem; margin-bottom: 1rem;">
          <a href="#" id="forgot-link" style="font-size: 0.875rem; color: #2563eb; text-decoration: none;">Forgot Password?</a>
        </div>

        <div id="auth-error" class="inline-error"></div>

        <button type="submit" id="auth-submit">Login</button>
      </form>

      <div id="forgot-password-section" style="display: none;">
        <form id="forgot-form">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" required>

          <div id="forgot-message" style="margin-top: 0.5rem; margin-bottom: 0.5rem; font-size: 0.875rem;"></div>

          <button type="submit" id="forgot-submit">Send Reset Link</button>
        </form>
        <div style="margin-top: 1rem; text-align: center;">
          <a href="#" id="back-to-login" style="font-size: 0.875rem; color: #2563eb; text-decoration: none;">Back to Login</a>
        </div>
      </div>
    </section>
  </div>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formTitle = document.getElementById('form-title');
    const authForm = document.getElementById('auth-form');
    const authError = document.getElementById('auth-error');
    const submitButton = document.getElementById('auth-submit');
    const forgotContainer = document.getElementById('forgot-container');
    const forgotLink = document.getElementById('forgot-link');
    const forgotPasswordSection = document.getElementById('forgot-password-section');
    const tabsContainer = document.querySelector('.tabs');
    const forgotForm = document.getElementById('forgot-form');
    const forgotMessage = document.getElementById('forgot-message');
    const backToLogin = document.getElementById('back-to-login');

    let mode = 'login';
    const nameField = document.getElementById('name-field');
    const nameInput = document.getElementById('name');

    function setMode(newMode) {
      mode = newMode;
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        formTitle.textContent = 'Login';
        submitButton.textContent = 'Login';
        nameInput.removeAttribute('required');
        nameField.style.display = 'none';
        if (forgotContainer) forgotContainer.style.display = 'block';
      } else {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        formTitle.textContent = 'Sign Up';
        submitButton.textContent = 'Sign Up';
        nameInput.setAttribute('required', '');
        nameField.style.display = 'block';
        if (forgotContainer) forgotContainer.style.display = 'none';
      }
      authError.textContent = '';
      authError.style.display = 'none';
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabSignup.addEventListener('click', () => setMode('signup'));

    setMode('login');

    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      tabsContainer.style.display = 'none';
      authForm.style.display = 'none';
      formTitle.textContent = 'Reset Password';
      forgotPasswordSection.style.display = 'block';
      forgotMessage.textContent = '';
      document.getElementById('forgot-email').value = '';
    });

    backToLogin.addEventListener('click', (e) => {
      e.preventDefault();
      forgotPasswordSection.style.display = 'none';
      tabsContainer.style.display = 'flex';
      authForm.style.display = 'block';
      setMode('login');
    });

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      forgotMessage.textContent = '';
      forgotMessage.style.color = 'inherit';

      const email = document.getElementById('forgot-email').value;

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }

        forgotMessage.style.color = 'green';
        forgotMessage.textContent = data.message || 'Check your email for a reset link';
      } catch (error) {
        forgotMessage.style.color = 'red';
        forgotMessage.textContent = error.message;
      }
    });

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.style.display = 'none';
      authError.textContent = '';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const url = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';

      console.log('[Auth] Fetching URL:', url);

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(mode === 'signup' ? { name, email, password } : { email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        const accessToken = data.session?.access_token;
        const role = data.role;
        const userId = data.user?.id;

        if (!accessToken) {
          throw new Error('No access token received');
        }

        localStorage.setItem('access_token', accessToken);
        localStorage.setItem('refresh_token', data.session?.refresh_token);
        localStorage.setItem('user_role', role || 'admin');
        localStorage.setItem('user_id', userId || '');
        window.location.href = '/index.html';
      } catch (error) {
        authError.textContent = error.message;
        authError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
