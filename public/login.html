<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trading Partners</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <meta name="theme-color" content="#14161a">
</head>
<body>
  <div class="container">
    <h1><img src="/icons/icon-192.png" alt="Trading Partners" class="app-logo">Trading Partners</h1>

    <div class="tabs">
      <button id="tab-login" class="tab-button active">Login</button>
      <button id="tab-signup" class="tab-button">Sign Up</button>
    </div>

    <section class="card">
      <h2 id="form-title">Login</h2>

      <form id="auth-form">
        <div id="name-field">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <div id="auth-error" class="inline-error"></div>

        <button type="submit" id="auth-submit">Login</button>
      </form>

      <button id="forgot-password-link" class="link-button">Forgot Password?</button>

      <div id="forgot-password-form" style="display:none;">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email">
        <button id="send-reset-link" class="btn-primary">Send Reset Link</button>
        <button id="back-to-login" class="link-button">Back to Login</button>
        <div id="reset-message" style="margin-top:12px; font-size:13px;"></div>
      </div>
    </section>
  </div>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formTitle = document.getElementById('form-title');
    const authForm = document.getElementById('auth-form');
    const authError = document.getElementById('auth-error');
    const submitButton = document.getElementById('auth-submit');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const forgotPasswordForm = document.getElementById('forgot-password-form');
    const tabsContainer = document.querySelector('.tabs');
    const resetEmailInput = document.getElementById('reset-email');
    const sendResetLinkBtn = document.getElementById('send-reset-link');
    const backToLoginBtn = document.getElementById('back-to-login');
    const resetMessage = document.getElementById('reset-message');

    let mode = 'login';
    const nameField = document.getElementById('name-field');
    const nameInput = document.getElementById('name');

    function setMode(newMode) {
      mode = newMode;
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        formTitle.textContent = 'Login';
        submitButton.textContent = 'Login';
        nameInput.removeAttribute('required');
        nameField.style.display = 'none';
        if (forgotPasswordLink) forgotPasswordLink.style.display = 'inline-block';
      } else {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        formTitle.textContent = 'Sign Up';
        submitButton.textContent = 'Sign Up';
        nameInput.setAttribute('required', '');
        nameField.style.display = 'block';
        if (forgotPasswordLink) forgotPasswordLink.style.display = 'none';
      }
      authError.textContent = '';
      authError.style.display = 'none';
    }

    tabLogin.addEventListener('click', () => {
      forgotPasswordForm.style.display = 'none';
      authForm.style.display = 'block';
      tabsContainer.style.display = 'flex';
      setMode('login');
    });

    tabSignup.addEventListener('click', () => {
      forgotPasswordForm.style.display = 'none';
      authForm.style.display = 'block';
      tabsContainer.style.display = 'flex';
      setMode('signup');
    });

    setMode('login');

    forgotPasswordLink.addEventListener('click', (e) => {
      e.preventDefault();
      tabsContainer.style.display = 'none';
      authForm.style.display = 'none';
      forgotPasswordLink.style.display = 'none';
      formTitle.textContent = 'Reset Password';
      forgotPasswordForm.style.display = 'block';
      resetMessage.textContent = '';
      resetEmailInput.value = '';
    });

    backToLoginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      forgotPasswordForm.style.display = 'none';
      tabsContainer.style.display = 'flex';
      authForm.style.display = 'block';
      setMode('login');
    });

    sendResetLinkBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      resetMessage.textContent = '';
      resetMessage.style.color = 'inherit';

      const email = resetEmailInput.value;

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }

        resetMessage.style.color = 'var(--profit, green)';
        resetMessage.textContent = data.message || 'Check your email for a reset link';
      } catch (error) {
        resetMessage.style.color = 'var(--loss, red)';
        resetMessage.textContent = error.message;
      }
    });

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.style.display = 'none';
      authError.textContent = '';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const url = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';

      console.log('[Auth] Fetching URL:', url);

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(mode === 'signup' ? { name, email, password } : { email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        const accessToken = data.session?.access_token;
        const role = data.role;
        const userId = data.user?.id;

        if (!accessToken) {
          throw new Error('No access token received');
        }

        localStorage.setItem('access_token', accessToken);
        localStorage.setItem('refresh_token', data.session?.refresh_token);
        localStorage.setItem('user_role', role || 'admin');
        localStorage.setItem('user_id', userId || '');
        window.location.href = '/index.html';
      } catch (error) {
        authError.textContent = error.message;
        authError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
