<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Partners</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <aside class="sidebar" id="desktop-sidebar">
    <div class="sidebar-highlight" id="sidebar-highlight"></div>
    <button class="sidebar-item active" data-target="tab-overview">
      <span class="nav-glyph">◆</span>
      <span class="sidebar-label">Overview</span>
    </button>
    <button class="sidebar-item" data-target="tab-ledger">
      <span class="nav-glyph">≡</span>
      <span class="sidebar-label">Ledger</span>
    </button>
    <button class="sidebar-item" data-target="tab-settings">
      <span class="nav-glyph">⚙</span>
      <span class="sidebar-label">Settings</span>
    </button>
  </aside>

  <div class="page-wrapper">
    <div class="page-header">
      <h1>Trading Partners</h1>
    </div>

    <div id="message-area"></div>

    <div id="tab-overview" data-tab="overview">
      <section class="section">
        <div class="section-title">Balances</div>
        <div class="table-scroll">
          <table id="balance-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Deposited</th>
                <th>Current Balance</th>
                <th>Ratio</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-ledger" data-tab="ledger" style="display:none">
      <section class="section admin-only">
        <div class="section-title">Log Daily P&L</div>
        <form id="pnl-form">
          <label for="pnl-type">Type</label>
          <select id="pnl-type" required>
            <option value="profit">Profit</option>
            <option value="loss">Loss</option>
          </select>

          <label for="pnl-amount">Amount</label>
          <input type="number" id="pnl-amount" step="0.01" min="0" required>

          <label for="pnl-date">Date</label>
          <input type="date" id="pnl-date" required>

          <div id="pnl-form-error" class="inline-error"></div>

          <button type="submit" id="pnl-submit">Submit P&L</button>
        </form>
      </section>

      <section class="section">
        <div class="section-title">P&L History</div>
        <div class="admin-only" style="margin-bottom: 1rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
          <button id="sync-bitget-btn" class="btn-secondary" style="display: none; width: auto;">Sync Bitget Trades</button>
          <input type="date" id="bitget-sync-from-date" style="display: none; margin-bottom: 0; width: auto;">
          <button id="delete-selected-btn" class="btn-danger" style="display: none; width: auto;">Delete Selected</button>
        </div>
        <div style="margin-bottom: 1rem; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;">
            <label for="pnl-filter-from">From</label>
            <input type="date" id="pnl-filter-from" style="margin-bottom: 0;">
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label for="pnl-filter-to">To</label>
            <input type="date" id="pnl-filter-to" style="margin-bottom: 0;">
          </div>
          <div>
            <button type="button" id="pnl-filter-apply" class="btn-secondary" style="margin-top: 0; width: auto;">Apply Filter</button>
          </div>
        </div>
        <div class="table-scroll">
          <table id="pnl-history-table">
            <thead>
              <tr>
                <th></th>
                <th>Date</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Logged By</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-settings" data-tab="settings" style="display:none">
      <div class="section admin-only">
        <div class="section-title">Bitget Integration</div>
        <button id="connect-bitget-btn" class="btn-secondary" style="width: auto;">Connect Bitget Account</button>
      </div>

      <div id="bitget-modal" class="modal-overlay admin-only" style="display: none;">
        <div class="modal-content">
          <button id="bitget-close-btn" class="modal-close-btn">X</button>
          <h2>Connect Your Bitget Account</h2>
          <label for="bitget-api-key">API Key</label>
          <input type="text" id="bitget-api-key">

          <label for="bitget-secret-key">Secret Key</label>
          <input type="password" id="bitget-secret-key">

          <label for="bitget-passphrase">Passphrase</label>
          <input type="password" id="bitget-passphrase">

          <div id="bitget-modal-message"></div>

          <button type="button" id="bitget-save-btn" class="btn-secondary">Test & Save</button>
        </div>
      </div>

      <section class="section partner-only">
        <div class="section-title">Privacy Settings</div>
        <form id="privacy-form">
          <label>
            <input type="checkbox" id="privacy-visible">
            Show my details to other partners
          </label>
          <div id="privacy-form-error" class="inline-error"></div>
          <button type="submit" id="privacy-submit">Save</button>
        </form>
      </section>

      <section class="section admin-only">
        <div class="section-title">Add Partner</div>
        <form id="partner-form">
          <label for="partner-name">Name</label>
          <input type="text" id="partner-name" required>

          <label for="partner-email">Email</label>
          <input type="email" id="partner-email" required>

          <label for="partner-password">Password</label>
          <input type="password" id="partner-password" required>

          <label for="partner-deposit-amount">Initial Deposit Amount (optional)</label>
          <input type="number" id="partner-deposit-amount" step="0.01" min="0">

          <label for="partner-deposit-date">Date</label>
          <input type="date" id="partner-deposit-date">

          <div id="partner-form-error" class="inline-error"></div>

          <button type="submit" id="partner-submit">Add Partner</button>
        </form>
      </section>

      <section class="section admin-only">
        <div class="section-title">Log Deposit/Withdrawal</div>
        <form id="transaction-form">
          <label for="transaction-partner">Partner</label>
          <select id="transaction-partner" required></select>

          <label for="transaction-type">Type</label>
          <select id="transaction-type" required>
            <option value="deposit">Deposit</option>
            <option value="withdrawal">Withdrawal</option>
          </select>

          <label for="transaction-amount">Amount</label>
          <input type="number" id="transaction-amount" step="0.01" min="0" required>

          <label for="transaction-date">Date</label>
          <input type="date" id="transaction-date" required>

          <div id="transaction-form-error" class="inline-error"></div>

          <button type="submit" id="transaction-submit">Submit</button>
        </form>
      </section>

      <section class="section">
        <div class="section-title">Account Action</div>
        <button id="logout-button" class="btn-secondary">Logout</button>
      </section>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-target="tab-overview">
      <span class="nav-glyph">◆</span>
      <span class="nav-label">Overview</span>
    </button>
    <button class="nav-item" data-target="tab-ledger">
      <span class="nav-glyph">≡</span>
      <span class="nav-label">Ledger</span>
    </button>
    <button class="nav-item" data-target="tab-settings">
      <span class="nav-glyph">⚙</span>
      <span class="nav-label">Settings</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
