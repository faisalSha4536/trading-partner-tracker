<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Partners - Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div class="container">
    <h1>Trading Partners</h1>

    <section class="card">
      <h2>Reset Password</h2>

      <form id="reset-form">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" required>

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" required>

        <div id="reset-error" class="inline-error"></div>

        <button type="submit" id="reset-submit">Reset Password</button>
      </form>
    </section>
  </div>

  <script>
    const resetForm = document.getElementById('reset-form');
    const resetError = document.getElementById('reset-error');
    const resetSubmit = document.getElementById('reset-submit');

    function getAccessTokenFromHash() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    const accessToken = getAccessTokenFromHash();

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetError.style.display = 'none';
      resetError.textContent = '';

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        resetError.textContent = 'Passwords do not match';
        resetError.style.display = 'block';
        return;
      }

      if (!accessToken) {
        resetError.textContent = 'Invalid or missing reset token. Please request a new reset link.';
        resetError.style.display = 'block';
        return;
      }

      resetSubmit.disabled = true;
      resetSubmit.textContent = 'Resetting...';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken, new_password: newPassword }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Password reset failed');
        }

        resetError.style.color = 'green';
        resetError.textContent = 'Password updated! Redirecting to login...';
        resetError.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 2000);
      } catch (error) {
        resetSubmit.disabled = false;
        resetSubmit.textContent = 'Reset Password';
        resetError.style.color = 'red';
        resetError.textContent = error.message;
        resetError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
